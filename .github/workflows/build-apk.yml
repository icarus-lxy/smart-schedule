name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'
      - run: |
          mkdir -p www
          cp index.html manifest.json sw.js icon-192.png icon-512.png www/
      - run: |
          cat > capacitor.config.json << 'EOF'
          {
            "appId": "com.smartschedule.app",
            "appName": "智能课表",
            "webDir": "www",
            "android": {
              "allowMixedContent": true
            }
          }
          EOF
      - run: npm install
      - run: npx cap add android
      - run: npx cap sync
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
